<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Mada — Portail BI</title>
<style>
    :root {
        /* ═══ CHARTE OFFICIELLE ═══ */
        /* Base */
        --white: #FFFFFF;
        --midnight: #002032;
        /* Main */
        --jade: #007380;            /* Premium Jade Green */
        --teal: #25E2CC;            /* Seafoam Teal */
        --unifying-blue: #003D5B;   /* Unifying Blue */
        /* Accent */
        --yellow: #FBCA18;          /* Sunshine Yellow */
        /* Restricted (alertes uniquement) */
        --raspberry: #CC3262;
        --tangerine: #F05E2E;
        /* Neutrals */
        --cool-gray: #F2F2F2;
        --charcoal: #2A2B2C;
        /* Seafoam Teal Tints */
        --teal-80: #51E8D6;
        --teal-60: #7CEEE0;
        --teal-40: #A8F3EB;
        --teal-20: #D3F8F5;
        --teal-10: #E9FCFA;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        /* Midnight → Unifying Blue */
        background: linear-gradient(165deg, var(--midnight) 0%, var(--midnight) 45%, var(--unifying-blue) 130%);
        min-height: 100vh;
        color: var(--white);
        display: flex;
        flex-direction: column;
    }

    /* ===== BARRE SUPÉRIEURE ===== */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.1rem 2.5rem;
        background: rgba(0, 32, 50, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(37, 226, 204, 0.25);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .cx-logo {
        font-weight: 800;
        font-size: 1.45rem;
        letter-spacing: -0.03em;
        color: var(--white);
        line-height: 1;
        user-select: none;
    }

    .cx-logo span { color: var(--teal); font-size: 1.7rem; line-height: 0; }

    .navbar-tag {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--teal);
        background: rgba(37, 226, 204, 0.1);
        border: 1px solid rgba(37, 226, 204, 0.35);
        padding: 0.35rem 0.9rem;
        border-radius: 50px;
        letter-spacing: 0.5px;
    }

    /* 💡 Logo officiel en fichier ? Remplacez le div .cx-logo par :
       <img src="logo.png" alt="Logo" style="height:32px;"> */

    /* ===== CONTENU ===== */
    main {
        flex: 1;
        padding: 2.5rem 1.5rem 2rem;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 2rem; }

    .logo-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: rgba(37, 226, 204, 0.1);
        border: 1px solid rgba(37, 226, 204, 0.4);
        color: var(--teal);
        padding: 0.45rem 1.3rem;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 1.2rem;
    }

    h1 {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    /* Accent Sunshine Yellow — usage ponctuel */
    h1 span { color: var(--yellow); }

    .subtitle {
        color: var(--teal-40);
        font-size: 1.1rem;
        opacity: 0.85;
    }

    /* ===== RECHERCHE ===== */
    .search-container {
        max-width: 450px;
        margin: 1.8rem auto 2.2rem;
        position: relative;
    }

    .search-container input {
        width: 100%;
        padding: 0.9rem 1.2rem 0.9rem 2.8rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(37, 226, 204, 0.25);
        border-radius: 12px;
        color: var(--white);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-container input::placeholder { color: var(--teal-40); opacity: 0.7; }

    .search-container input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(37, 226, 204, 0.15);
    }

    .search-container svg {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        stroke: var(--teal-40);
    }

    /* ===== GRILLE ===== */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
    }

    /* ===== CARTES ===== */
    .card {
        background: rgba(0, 61, 91, 0.85);  /* Unifying Blue */
        border: 1px solid rgba(37, 226, 204, 0.18);
        border-radius: 16px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        text-decoration: none;
        color: inherit;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--teal), var(--teal-80));
        opacity: 0;
        transition: opacity 0.25s;
    }

    .card:hover:not(.maintenance) {
        transform: translateY(-4px);
        border-color: var(--teal);
        box-shadow: 0 12px 35px rgba(37, 226, 204, 0.2);
    }

    .card:hover:not(.maintenance)::before { opacity: 1; }

    .card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 1.4rem;
    }

    .card-title {
        font-size: 1.15rem;
        font-weight: 600;
        line-height: 1.3;
        color: var(--white);
    }

    .card-description {
        color: var(--teal-40);
        opacity: 0.85;
        font-size: 0.9rem;
        line-height: 1.5;
        flex-grow: 1;
    }

    .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.5rem;
    }

    .card-tag {
        font-size: 0.75rem;
        color: var(--teal);
        background: rgba(37, 226, 204, 0.12);
        padding: 0.25rem 0.75rem;
        border-radius: 50px;
    }

    .arrow-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--teal);  /* Seafoam Teal */
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
    }

    .arrow-btn svg {
        width: 18px; height: 18px;
        stroke: var(--midnight);  /* Contraste sur teal */
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .card:hover:not(.maintenance) .arrow-btn {
        background: var(--teal-80);
        transform: translateX(3px);
        box-shadow: 0 4px 15px rgba(37, 226, 204, 0.45);
    }

    /* ===== MAINTENANCE (Tangerine — couleur d'alerte) ===== */
    .card.maintenance {
        opacity: 0.55;
        cursor: not-allowed;
        pointer-events: none;
        border-color: rgba(240, 94, 46, 0.35);
    }

    .maintenance-badge {
        position: absolute;
        top: 1rem; right: 1rem;
        background: rgba(240, 94, 46, 0.12);
        color: var(--tangerine);
        border: 1px solid rgba(240, 94, 46, 0.45);
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.3rem 0.7rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .maintenance-badge .dot {
        width: 6px; height: 6px;
        background: var(--tangerine);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    .no-result {
        text-align: center;
        color: var(--teal-40);
        padding: 3rem;
        display: none;
    }

    /* ===== FOOTER ===== */
    footer {
        text-align: center;
        padding: 2rem 1.5rem 2.5rem;
        border-top: 1px solid rgba(37, 226, 204, 0.2);
        background: rgba(0, 32, 50, 0.6);
    }

    footer .cx-logo { font-size: 1.15rem; margin-bottom: 0.8rem; }
    footer .cx-logo span { font-size: 1.35rem; }

    .footer-message {
        color: var(--teal-40);
        font-size: 0.85rem;
        line-height: 1.7;
        opacity: 0.85;
    }

    .footer-message strong { color: var(--white); font-weight: 600; }
</style>
</head>
<body>

<!-- ═══════════ BARRE SUPÉRIEURE ═══════════ -->
<nav class="navbar">
    <div class="cx-logo">concentrix<span>.</span></div>
    <span class="navbar-tag">GO MADA BI</span>
</nav>

<main>
    <header>
        <div class="logo-badge">📊 GO MADA BI</div>
        <h1>Bienvenue sur <span>Go Mada</span></h1>
        <p class="subtitle">Veuillez sélectionner votre espace BI</p>
    </header>

    <div class="search-container">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Rechercher un outil..." onkeyup="filterCards()">
    </div>

    <div class="grid" id="cardGrid"></div>
    <div class="no-result" id="noResult">Aucun outil ne correspond à votre recherche.</div>
</main>

<!-- ═══════════ FOOTER ═══════════ -->
<footer>
    <div class="cx-logo">concentrix<span>.</span></div>
    <p class="footer-message">
        © 2025 <strong>Concentrix Corporation</strong>. Tous droits réservés.<br>
        Go Mada BI — Portail de reporting interne à usage professionnel uniquement.
    </p>
</footer>

<script>
/* ============================================================
   ⚙️ CONFIGURATION — Modifiez uniquement cette partie
   ============================================================ */
const MODULES = [
    {
        titre: "Analyse Atterrissage",
        description: "Suivi et analyse des données d'atterrissage : ponctualité, régularité et performance des vols.",
        lien: "https://app.powerbi.com/groups/me/reports/VOTRE-ID-REPORT-1",
        tag: "Opérations",
        couleurIcone: "#25E2CC",   /* Seafoam Teal */
        maintenance: false
    },
    {
        titre: "Finance Budget Madagascar",
        description: "Consolidation budgétaire, suivi des écarts et pilotage financier de la filiale Madagascar.",
        lien: "https://app.powerbi.com/groups/me/reports/VOTRE-ID-REPORT-2",
        tag: "Finance",
        couleurIcone: "#FBCA18",   /* Sunshine Yellow */
        maintenance: false
    },
    {
        titre: "Simulateur Prime de régularité",
        description: "Simulation et calcul des primes de régularité du personnel selon les indicateurs de performance.",
        lien: "https://app.powerbi.com/groups/me/reports/VOTRE-ID-REPORT-3",
        tag: "RH",
        couleurIcone: "#51E8D6",   /* Teal 80% */
        maintenance: false
    },
    {
        titre: "Reporting Commercial",
        description: "Analyse des ventes, revenus et performance commerciale par segment et région.",
        lien: "#",
        tag: "Commercial",
        couleurIcone: "#7CEEE0",   /* Teal 60% */
        maintenance: true
    },
    {
        titre: "Tableau de Bord QSE",
        description: "Indicateurs Qualité, Sécurité et Environnement avec suivi des audits et incidents.",
        lien: "#",
        tag: "QSE",
        couleurIcone: "#007380",   /* Premium Jade Green */
        maintenance: true
    }
];

/* ============================================================
   🔧 GÉNÉRATION DES CARTES
   ============================================================ */
const ICONES = {
    "Opérations": "✈️",
    "Finance": "💰",
    "RH": "👥",
    "Commercial": "📈",
    "QSE": "🛡️"
};

function creerCarte(module) {
    const carte = document.createElement('a');
    carte.href = module.maintenance ? '#' : module.lien;
    carte.className = 'card' + (module.maintenance ? ' maintenance' : '');
    carte.target = module.maintenance ? '_self' : '_blank';

    const icone = ICONES[module.tag] || '📊';
    const badgeMaintenance = module.maintenance
        ? `<span class="maintenance-badge"><span class="dot"></span>En cours de Maintenance</span>`
        : '';

    carte.innerHTML = `
        ${badgeMaintenance}
        <div class="card-icon" style="background:${module.couleurIcone}22; border:1px solid ${module.couleurIcone}55;">
            <span>${icone}</span>
        </div>
        <div class="card-title">${module.titre}</div>
        <div class="card-description">${module.description}</div>
        <div class="card-footer">
            <span class="card-tag">${module.tag}</span>
            <div class="arrow-btn">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </div>
    `;
    return carte;
}

const grid = document.getElementById('cardGrid');
MODULES.forEach(m => grid.appendChild(creerCarte(m)));

/* 🔍 Recherche */
function filterCards() {
    const recherche = document.getElementById('searchInput').value.toLowerCase();
    const cartes = document.querySelectorAll('.card');
    let visible = 0;

    cartes.forEach(carte => {
        const texte = carte.textContent.toLowerCase();
        const afficher = texte.includes(recherche);
        carte.style.display = afficher ? '' : 'none';
        if (afficher) visible++;
    });

    document.getElementById('noResult').style.display = visible ? 'none' : 'block';
}
</script>
</body>
</html>
