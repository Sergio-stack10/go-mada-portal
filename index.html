<style>
    :root {
        /* ═══ CHARTE OFFICIELLE ═══ */
        --white: #FFFFFF;
        --midnight: #002032;
        --jade: #007380;
        --teal: #25E2CC;
        --unifying-blue: #003D5B;
        --yellow: #FBCA18;
        --tangerine: #F05E2E;
        --teal-80: #51E8D6;
        --teal-60: #7CEEE0;
        --teal-40: #A8F3EB;
        --teal-20: #D3F8F5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(165deg, var(--midnight) 0%, var(--midnight) 45%, var(--unifying-blue) 130%);
        min-height: 100vh;
        color: var(--white);
        display: flex;
        flex-direction: column;
    }

    /* ===== BARRE SUPÉRIEURE ===== */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.1rem 2.5rem;
        background: rgba(0, 32, 50, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(37, 226, 204, 0.25);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .cx-logo {
        font-weight: 800;
        font-size: 1.45rem;
        letter-spacing: -0.03em;
        line-height: 1;
        user-select: none;
    }

    .cx-logo span { color: var(--teal); font-size: 1.7rem; line-height: 0; }

    .navbar-tag {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--teal);
        background: rgba(37, 226, 204, 0.1);
        border: 1px solid rgba(37, 226, 204, 0.35);
        padding: 0.35rem 0.9rem;
        border-radius: 50px;
        letter-spacing: 0.5px;
    }

    main {
        flex: 1;
        padding: 2.5rem 2rem 2.5rem;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    h1 {
        font-size: clamp(1.9rem, 4vw, 2.7rem);
        font-weight: 700;
        margin-bottom: 0.6rem;
    }

    h1 span { color: var(--yellow); }

    .subtitle { color: var(--teal-40); font-size: 1.1rem; }

    /* ===== EN-TÊTE DE SECTION ===== */
    .section { margin-bottom: 3rem; }

    .section-header {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 1.4rem;
    }

    .section-icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: rgba(37, 226, 204, 0.1);
        border: 1px solid rgba(37, 226, 204, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .section-icon svg { width: 24px; height: 24px; }

    .section-title {
        font-size: 1.15rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.8px;
        color: var(--teal);
        white-space: nowrap;
    }

    .section-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, rgba(37, 226, 204, 0.45), rgba(37, 226, 204, 0.05));
    }

    .section-count {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--teal-40);
        background: rgba(37, 226, 204, 0.1);
        border: 1px solid rgba(37, 226, 204, 0.25);
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        white-space: nowrap;
    }

    /* ===== GRILLES ===== */
    .grid-pbi {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.4rem;
    }

    .grid-web {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.4rem;
    }

    @media (max-width: 1024px) {
        .grid-pbi { grid-template-columns: repeat(2, 1fr); }
        .grid-web { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
        .grid-pbi, .grid-web { grid-template-columns: 1fr; }
        .section-title { font-size: 1rem; letter-spacing: 1.2px; }
    }

    /* ===== CARTE ===== */
    .card {
        background: rgba(0, 61, 91, 0.85);
        border: 1px solid rgba(37, 226, 204, 0.18);
        border-radius: 16px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--teal), var(--teal-80));
        opacity: 0;
        transition: opacity 0.25s;
    }

    .card:hover:not(.maintenance) {
        transform: translateY(-4px);
        border-color: var(--teal);
        box-shadow: 0 12px 35px rgba(37, 226, 204, 0.2);
    }

    .card:hover:not(.maintenance)::before { opacity: 1; }

    .card-head {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin-bottom: 0.9rem;
        padding-right: 8.5rem;
    }

    .card-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: rgba(37, 226, 204, 0.08);
        border: 1px solid rgba(37, 226, 204, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .card-icon svg, .card-icon img { width: 28px; height: 28px; }

    .card-category {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--teal);
        margin-bottom: 0.15rem;
    }

    .card-title {
        font-size: 1.18rem;
        font-weight: 700;
        line-height: 1.25;
    }

    .card-description {
        color: var(--teal-40);
        font-size: 0.86rem;
        line-height: 1.55;
        flex-grow: 1;
    }

    .arrow-btn {
        align-self: flex-end;
        margin-top: 1rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--teal);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
    }

    .arrow-btn svg {
        width: 19px; height: 19px;
        stroke: var(--midnight);
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .card:hover:not(.maintenance) .arrow-btn {
        background: var(--teal-80);
        transform: translateX(4px);
        box-shadow: 0 4px 15px rgba(37, 226, 204, 0.45);
    }

    /* ===== MAINTENANCE ===== */
    .card.maintenance {
        opacity: 0.55;
        cursor: not-allowed;
        pointer-events: none;
        border-color: rgba(240, 94, 46, 0.35);
    }

    .maintenance-badge {
        position: absolute;
        top: 1.1rem; right: 1.1rem;
        background: rgba(240, 94, 46, 0.12);
        color: var(--tangerine);
        border: 1px solid rgba(240, 94, 46, 0.45);
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.3rem 0.7rem;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .maintenance-badge .dot {
        width: 6px; height: 6px;
        background: var(--tangerine);
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    /* ===== FOOTER ===== */
    footer {
        text-align: center;
        padding: 2rem 1.5rem 2.5rem;
        border-top: 1px solid rgba(37, 226, 204, 0.2);
        background: rgba(0, 32, 50, 0.6);
    }

    footer .cx-logo { font-size: 1.15rem; margin-bottom: 0.8rem; }
    footer .cx-logo span { font-size: 1.35rem; }

    .footer-message {
        color: var(--teal-40);
        font-size: 0.85rem;
        line-height: 1.7;
    }

    .footer-message strong { color: var(--white); font-weight: 600; }

    @media (max-width: 640px) {
        .navbar { padding: 1rem 1.25rem; }
        main { padding: 2rem 1.25rem; }
        .card-head { padding-right: 0; }
        .maintenance-badge { position: static; align-self: flex-start; margin-bottom: 0.75rem; }
    }
</style>

/* ============================================================
   🔧 GÉNÉRATION DES SECTIONS ET CARTES — ne pas modifier
   ============================================================ */
function creerCarte(module) {
    const carte = document.createElement('a');
    carte.href = module.maintenance ? '#' : module.lien;
    carte.className = 'card' + (module.maintenance ? ' maintenance' : '');
    carte.target = module.maintenance ? '_self' : '_blank';

    const badge = module.maintenance
        ? `<span class="maintenance-badge"><span class="dot"></span>En cours de Maintenance</span>`
        : '';

    /* Le champ image (fichier flaticon) est prioritaire sur l'icône SVG */
    const visuel = module.image
        ? `<img src="${module.image}" alt="${module.nom}">`
        : ICONES[module.icone];

    carte.innerHTML = `
        ${badge}
        <div class="card-head">
            <div class="card-icon">${visuel}</div>
            <div>
                <div class="card-category">${module.categorie}</div>
                <div class="card-title">${module.nom}</div>
            </div>
        </div>
        <div class="card-description">${module.description}</div>
        <div class="arrow-btn">
            <svg viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </div>
    `;
    return carte;
}

const conteneur = document.getElementById('sections');

SECTIONS.forEach(section => {
    const bloc = document.createElement('div');
    bloc.className = 'section';

    bloc.innerHTML = `
        <div class="section-header">
            <div class="section-icon">${ICONES[section.icone]}</div>
            <h2 class="section-title">${section.titre}</h2>
            <span class="section-line"></span>
            <span class="section-count">${section.modules.length} ${section.id === 'pbi' ? 'rapports' : 'applications'}</span>
        </div>
        <div class="${section.id === 'pbi' ? 'grid-pbi' : 'grid-web'}"></div>
    `;

    const grille = bloc.querySelector('.grid-pbi, .grid-web');
    section.modules.forEach(m => grille.appendChild(creerCarte(m)));

    conteneur.appendChild(bloc);
});
</script>
</body>
</html>
